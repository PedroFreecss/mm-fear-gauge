[project]
name = "fear_gauge"
version = "0.1.0"
description = "Recupera a aversão a risco de um market maker da Hyperliquid a partir de dados públicos"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "requests>=2.31",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter", "nbconvert", "ipykernel"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
